const fmt = (iso, f) => {
  const d = new Date(iso);
  if (f==="short")   return d.toLocaleDateString("en-GB", {day:"numeric",month:"short"});
  if (f==="long")    return d.toLocaleDateString("en-GB", {weekday:"long",day:"numeric",month:"long"});
  if (f==="time")    return d.toLocaleTimeString("en-GB",  {hour:"2-digit",minute:"2-digit"});
  if (f==="chart")   return d.toLocaleDateString("en-GB", {day:"numeric",month:"short"});
  return d.toLocaleDateString();
};
const relDate = iso => {
  const d=new Date(iso), t=new Date(), y=new Date(t);
  y.setDate(t.getDate()-1);
  if (d.toDateString()===t.toDateString()) return "Today";
  if (d.toDateString()===y.toDateString()) return "Yesterday";
  return fmt(iso,"short");
};

// ─── SAMPLE DATA ──────────────────────────────────────────────────────────────
function genData() {
  const out = [], now = new Date();
  for (let ago = 59; ago >= 0; ago--) {
    if (ago > 0 && Math.random() < 0.22) continue;
    const date = new Date(now);
    date.setDate(now.getDate() - ago);
    const sleep  = Math.min(9, Math.max(3.5, 6.3 + Math.sin(ago * 0.71) * 1.4 + (Math.random()-0.5)*1.8));
    const stress = Math.random() < 0.2;
    const improve = (60-ago)/60 * 1.8;
    const raw = 6.8 - improve + (sleep<6?(6-sleep)*1.1:0) + (stress?1.8:0) + (Math.random()-0.5)*1.4;
    const pain = Math.round(Math.min(10, Math.max(1, raw)));
    const syms = [pain>5?"Aching":"Stiffness"];
    if (pain>4) syms.push(["Throbbing","Fatigue","Burning"][Math.floor(Math.random()*3)]);
    if (pain>7) syms.push("Weakness");
    const locs = ["Lower Back"];
    if (pain>5) locs.push("Hips");
    if (Math.random()<0.25) locs.push("Neck");
    const trigs = [];
    if (sleep<6) trigs.push("Poor Sleep");
    if (stress)  trigs.push("Stress");
    if (Math.random()<0.12) trigs.push("Physical Activity");
    out.push({
      id: `e${ago}-${Math.random().toString(36).slice(2,5)}`,
      loggedAt: date.toISOString(),
      painLevel: pain,
      locations: locs,
      symptoms: syms,
      durationMinutes: [60,90,120,180,240][Math.floor(Math.random()*5)],
      notes: pain>=8 ? "Very difficult day — had to rest." : pain<=2 ? "Feeling better today." : "",
      triggers: trigs,
      mood: Math.max(1, Math.min(5, Math.round(5 - pain*0.38 + Math.random()*0.8))),
      energyLevel: Math.max(1, Math.min(5, Math.round(5 - pain*0.32 + sleep*0.12))),
      sleepHours: Math.round(sleep*2)/2,
      medications: pain>=7 ? ["Ibuprofen 400mg"] : [],
    });
  }
  return out.sort((a,b) => new Date(b.loggedAt)-new Date(a.loggedAt));
}
const INIT_DATA = genData();

// ─── CSV EXPORT ───────────────────────────────────────────────────────────────
function exportCSV(entries) {
  const cols = ["Date","Time","Pain","Locations","Symptoms","Duration(min)","Triggers","Mood","Energy","Sleep(h)","Notes"];
  const rows = entries.map(e => [
    fmt(e.loggedAt,"short"), fmt(e.loggedAt,"time"),
    e.painLevel, e.locations.join("|"), e.symptoms.join("|"),
    e.durationMinutes||"", e.triggers.join("|"),
    e.mood||"", e.energyLevel||"", e.sleepHours||"",
    (e.notes||"").replace(/,/g," ")
  ]);
  const csv = [cols,...rows].map(r=>r.join(",")).join("\n");
  const a = document.createElement("a");
  a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
  a.download = `painlog-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// Two-level hierarchical picker: region → specific clinical sub-location
function LocationPicker({ selected, onChange }) {
  const [expanded, setExpanded] = useState(null);
  const regions = Object.keys(BODY_MAP);

  // Count selected sub-locations for a given region
  const countFor = r => selected.filter(l => l.startsWith(r + " · ")).length;

  const toggleSub = (region, sub) => {
    const key = `${region} · ${sub}`;
    onChange(selected.includes(key) ? selected.filter(s => s !== key) : [...selected, key]);
  };

  const removeOne = loc => onChange(selected.filter(s => s !== loc));

  // Shorten the display label for tags — drop the region prefix for brevity
  const tagLabel = loc => {
    const parts = loc.split(" · ");
    return parts.length === 2 ? parts[1] : loc;
  };
  const tagRegion = loc => {
    const parts = loc.split(" · ");
    return parts.length === 2 ? parts[0] : "";
  };

  return (
    <div>
      {/* Selected tags */}
      {selected.length > 0 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom:"0.9rem", padding:"10px 12px", background:C.bgDeep, borderRadius:10, border:`1px solid ${C.borderGold}` }}>
          <div style={{ width:"100%", fontSize:"0.65rem", color:C.gold, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:4 }}>
            Selected locations
          </div>
          {selected.map(loc => (
            <div key={loc} style={{ display:"flex", alignItems:"center", gap:3, padding:"3px 6px 3px 10px", borderRadius:99, background:C.goldLight, border:`1px solid ${C.borderGold}` }}>
              <span style={{ fontSize:"0.67rem", color:C.muted, marginRight:2 }}>{tagRegion(loc)}</span>
              <span style={{ fontSize:"0.72rem", color:C.gold, fontWeight:500 }}>{tagLabel(loc)}</span>
              <button onClick={() => removeOne(loc)} style={{ background:"none", border:"none", cursor:"pointer", color:C.muted, padding:"0 2px", display:"flex", alignItems:"center", lineHeight:1 }}>
                <X size={10}/>
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Body region grid */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:6 }}>
        {regions.map(region => {
          const count   = countFor(region);
          const isOpen  = expanded === region;
          return (
            <button key={region}
              onClick={() => setExpanded(isOpen ? null : region)}
              style={{
                padding:"9px 6px", borderRadius:10, fontFamily:"inherit",
                fontSize:"0.75rem", fontWeight: isOpen || count > 0 ? 600 : 400,
                cursor:"pointer", transition:"all .15s", textAlign:"center",
                position:"relative",
                border:`1.5px solid ${isOpen ? C.gold : count > 0 ? C.borderGold : C.border}`,
                background: isOpen ? C.goldLight : count > 0 ? "rgba(201,164,74,0.07)" : "transparent",
                color: isOpen ? C.gold : count > 0 ? C.gold : "rgba(255,255,255,0.5)",
              }}>
              {region}
              {count > 0 && (
                <span style={{
                  position:"absolute", top:-7, right:-7,
                  width:18, height:18, borderRadius:"50%",
                  background:C.gold, color:"#080e25",
                  fontSize:"0.6rem", fontWeight:700,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  boxShadow:"0 0 0 2px #080e25",
                }}>
                  {count}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {/* Sub-location panel — slides in below the grid */}
      {expanded && (
        <div style={{ marginTop:"0.75rem", padding:"1rem", background:C.bgDeep, borderRadius:12, border:`1px solid ${C.borderGold}` }} className="fade-in">
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.6rem" }}>
            <div style={{ fontSize:"0.7rem", color:C.gold, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em" }}>
              {expanded} — select specific area
            </div>
            {countFor(expanded) > 0 && (
              <button onClick={() => onChange(selected.filter(s => !s.startsWith(expanded + " · ")))}
                style={{ fontSize:"0.67rem", color:"#e06070", background:"none", border:"none", cursor:"pointer", fontFamily:"inherit" }}>
                Clear {expanded}
              </button>
            )}
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
            {BODY_MAP[expanded].map(sub => {
              const key      = `${expanded} · ${sub}`;
              const isSel    = selected.includes(key);
              return (
                <button key={sub} onClick={() => toggleSub(expanded, sub)} style={{
                  padding:"5px 11px", borderRadius:99, fontFamily:"inherit", fontSize:"0.75rem",
                  fontWeight: isSel ? 600 : 400, cursor:"pointer", transition:"all .15s", whiteSpace:"nowrap",
                  border:`1.5px solid ${isSel ? C.gold : "rgba(255,255,255,0.13)"}`,
                  background: isSel ? C.goldLight : "rgba(255,255,255,0.03)",
                  color: isSel ? C.gold : "rgba(255,255,255,0.55)",
                }}>
                  {isSel && <span style={{ marginRight:4 }}>✓</span>}{sub}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {selected.length === 0 && (
        <p style={{ fontSize:"0.75rem", color:"#e06070", marginTop:8 }}>Select at least one location.</p>
      )}
    </div>
  );
}

// ─── LOG ENTRY SCREEN ─────────────────────────────────────────────────────────
function LogEntry({ onSave, onBack, editEntry }) {
  const blank = {

            <div style={{ fontSize:"0.64rem", color:i===step?C.gold:C.muted, marginTop:4, textAlign:"center", fontWeight:i===step?600:400 }}>

            <SectionLabel>Where do you feel it?</SectionLabel>

          </NavyCard>

            <SectionLabel>What does it feel like?</SectionLabel>

            <SectionLabel>Overall Wellbeing</SectionLabel>

  );

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function Dashboard({ entries, onNavigate, onLog, aiInsights, loadingAI, fetchAI }) {
  const last7  = entries.filter(e => new Date(e.loggedAt) >= new Date(Date.now()-7*864e5));
  const last30 = entries.filter(e => new Date(e.loggedAt) >= new Date(Date.now()-30*864e5));
  const avg7   = last7.length  ? +(last7.reduce((s,e)=>s+e.painLevel,0)/last7.length).toFixed(1)  : 0;
  const avg30  = last30.length ? +(last30.reduce((s,e)=>s+e.painLevel,0)/last30.length).toFixed(1) : 0;
  const trend  = avg7 - avg30;
  const peak7  = last7.length  ? Math.max(...last7.map(e=>e.painLevel)) : 0;

  // Top symptom (30d)
  const sf = {};
  last30.forEach(e => e.symptoms.forEach(s => sf[s]=(sf[s]||0)+1));
  const topSym = Object.entries(sf).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";

  // Top locations (30d) — frequency ranked, with avg pain per location
  const lf = {}, lp = {};
  last30.forEach(e => e.locations.forEach(l => {
    lf[l] = (lf[l]||0) + 1;
    if (!lp[l]) lp[l] = { sum:0, n:0 };
    lp[l].sum += e.painLevel; lp[l].n++;
  }));
  const topLocs = Object.entries(lf).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topLocName = topLocs[0] ? locShort(topLocs[0][0]) : "—";
  const topLocMax  = topLocs[0]?.[1] || 1;

  const chartData = useMemo(() => {
    const days = [];
    for (let i=20; i>=0; i--) {
      const day = new Date(Date.now()-i*864e5);
      const de  = entries.filter(e => new Date(e.loggedAt).toDateString()===day.toDateString());
      days.push({
        day: fmt(day.toISOString(),"chart"),
        avg: de.length ? +(de.reduce((s,e)=>s+e.painLevel,0)/de.length).toFixed(1) : null,
      });
    }
    return days;
  }, [entries]);

  const hr = new Date().getHours();
  const greeting = hr<12 ? "Good morning" : hr<17 ? "Good afternoon" : "Good evening";

  return (
    <div className="fade-in">
      <div style={{ marginBottom:"1.5rem" }}>
        <div style={{ fontSize:"0.78rem", color:C.muted }}>{greeting}</div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"2rem", fontWeight:600, color:C.text, lineHeight:1.2, marginTop:2 }}>
          Your Pain Overview
        </div>
      </div>

      {/* Stat cards — row 1: three columns */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10, marginBottom:10 }}>
        {[
          { label:"7-Day Average", val:avg7,
            sub:<span style={{display:"flex",alignItems:"center",gap:3,fontSize:"0.68rem",color:trend<0?"#4ecf8a":trend>0?"#e06070":C.muted}}>
              {trend<0?<TrendingDown size={11}/>:trend>0?<TrendingUp size={11}/>:null}
              {trend!==0 ? `${Math.abs(trend).toFixed(1)} vs 30d` : "Stable"}
            </span> },
          { label:"Entries (7d)", val:last7.length, sub:<span style={{fontSize:"0.68rem",color:C.muted}}>logged</span> },
          { label:"Peak (7d)", val:`${peak7}/10`, sub:<span style={{fontSize:"0.68rem",color:getPainColor(peak7)}}>{getPainLabel(peak7)}</span> },
        ].map((c,i) => (
          <NavyCard key={i} style={{ padding:"0.85rem" }}>
            <div style={{ fontSize:"0.62rem", color:C.muted, marginBottom:4, textTransform:"uppercase", letterSpacing:"0.08em" }}>{c.label}</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.75rem", fontWeight:600, color:C.gold, lineHeight:1.1 }}>{c.val}</div>
            <div style={{ marginTop:3 }}>{c.sub}</div>
          </NavyCard>
        ))}
      </div>

      {/* Row 2: top symptom + top location */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:"1.25rem" }}>
        {[
          { label:"Top Symptom (30d)", val:topSym,   sub:<span style={{fontSize:"0.68rem",color:C.muted}}>most logged</span> },
          { label:"Top Location (30d)", val:topLocName, sub:<span style={{fontSize:"0.68rem",color:C.muted}}>most affected</span> },
        ].map((c,i) => (
          <NavyCard key={i} style={{ padding:"0.85rem" }}>
            <div style={{ fontSize:"0.62rem", color:C.muted, marginBottom:4, textTransform:"uppercase", letterSpacing:"0.08em" }}>{c.label}</div>
            <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1rem", fontWeight:600, color:C.gold, lineHeight:1.3 }}>{c.val}</div>
            <div style={{ marginTop:3 }}>{c.sub}</div>
          </NavyCard>
        ))}
      </div>

      {/* Top locations frequency bar — full width */}
      {topLocs.length > 0 && (
        <NavyCard style={{ marginBottom:"1.25rem", padding:"1rem" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.75rem" }}>
            <div style={{ fontSize:"0.67rem", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", color:C.muted }}>Top Locations — 30 Days</div>
            <button onClick={()=>onNavigate("analytics")} style={{ fontSize:"0.72rem", color:C.gold, background:"none", border:"none", cursor:"pointer", fontFamily:"inherit" }}>
              Full breakdown →
            </button>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
            {topLocs.map(([loc, count], i) => {
              const region = locRegion(loc);
              const short  = locShort(loc);
              const avgPain = lp[loc] ? +(lp[loc].sum/lp[loc].n).toFixed(1) : 0;
              const pct    = (count / topLocMax) * 100;
              return (
                <div key={loc} style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ width:16, fontSize:"0.65rem", color:C.muted, textAlign:"right", flexShrink:0 }}>#{i+1}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
                      <span style={{ fontSize:"0.75rem", color:C.text, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                        {short}
                        {region && <span style={{ color:C.muted, fontSize:"0.67rem", marginLeft:5 }}>{region}</span>}
                      </span>
                      <span style={{ fontSize:"0.7rem", color:getPainColor(avgPain), fontWeight:600, flexShrink:0, marginLeft:6 }}>
                        avg {avgPain}/10
                      </span>
                    </div>
                    <div style={{ height:5, background:C.bgDeep, borderRadius:3, overflow:"hidden" }}>
                      <div style={{ width:`${pct}%`, height:"100%", background:`linear-gradient(90deg,${C.gold},${getPainColor(avgPain)})`, borderRadius:3, transition:"width .4s" }}/>
                    </div>
                  </div>
                  <span style={{ fontSize:"0.72rem", color:C.muted, width:24, textAlign:"right", flexShrink:0 }}>{count}×</span>
                </div>
              );
            })}
          </div>
        </NavyCard>
      )}

      {/* Trend chart */}
      <NavyCard style={{ marginBottom:"1.25rem", padding:"1rem 1rem 0.5rem" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.75rem" }}>
          <div style={{ fontSize:"0.67rem", fontWeight:600, letterSpacing:"0.12em", textTransform:"uppercase", color:C.muted }}>21-Day Trend</div>
          <button onClick={()=>onNavigate("analytics")} style={{ fontSize:"0.72rem", color:C.gold, background:"none", border:"none", cursor:"pointer", fontFamily:"inherit" }}>
            View all →
          </button>
        </div>
        <ResponsiveContainer width="100%" height={130}>
          <AreaChart data={chartData} margin={{top:4,right:4,left:-30,bottom:0}}>
            <defs>
              <linearGradient id="ggrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="5%"  stopColor={C.gold} stopOpacity={0.35}/>
                <stop offset="95%" stopColor={C.gold} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)" vertical={false}/>
            <XAxis dataKey="day" tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false} interval={3}/>
            <YAxis domain={[0,10]} tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false}/>
            <ReferenceLine y={7} stroke="#e06070" strokeDasharray="4 4" strokeOpacity={0.4}/>
            <Tooltip content={<ChartTip/>}/>
            <Area type="monotone" dataKey="avg" name="Pain" stroke={C.gold} strokeWidth={2}
              fill="url(#ggrad)" connectNulls={false}
              dot={(props) => {
                const { cx, cy, payload } = props;
                if (!payload.avg) return null;
                return <circle key={`d${cx}`} cx={cx} cy={cy} r={3} fill={getPainColor(payload.avg)} stroke={C.card} strokeWidth={1.5}/>;
              }}
            />
          </AreaChart>
        </ResponsiveContainer>
      </NavyCard>

      {/* AI Insights */}
      <NavyCard style={{ marginBottom:"1.25rem", padding:"1rem", border:`1px solid ${C.borderGold}` }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.75rem" }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:"0.82rem", fontWeight:600, color:C.gold }}>
            <Sparkles size={14}/> AI Insights
          </div>
          <button onClick={fetchAI} disabled={loadingAI} style={{
            fontSize:"0.7rem", color:C.gold, background:"none", border:"none", cursor:"pointer",
            fontFamily:"inherit", display:"flex", alignItems:"center", gap:4, opacity:loadingAI?0.5:1,
          }}>
            <RefreshCw size={11} className={loadingAI?"spinning":""}/>
            {loadingAI ? "Analysing…" : "Refresh"}
          </button>
        </div>
        {loadingAI && (
          <div style={{ textAlign:"center", padding:"1rem", color:C.muted, fontSize:"0.82rem" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}><Loader size={18} className="spinning"/></div>
            Analysing your recent data…
          </div>
        )}
        {!loadingAI && aiInsights.length===0 && (
          <div style={{ textAlign:"center", padding:"0.5rem", color:C.muted, fontSize:"0.8rem" }}>
            Click Refresh to generate insights from your recent entries.
          </div>
        )}
        {!loadingAI && aiInsights.map((ins,i) => (
          <div key={i} style={{ display:"flex", gap:10, marginBottom:8, padding:"10px 12px", background:C.bgDeep, borderRadius:10, border:`1px solid ${C.border}` }}>
            <div style={{ width:28, height:28, borderRadius:8, background:C.goldLight, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              {ins.type==="pattern" ? <Brain size={13} color={C.gold}/> : ins.type==="trend" ? <TrendingUp size={13} color={C.gold}/> : <Zap size={13} color={C.gold}/>}
            </div>
            <div>
              <div style={{ fontWeight:600, fontSize:"0.82rem", color:C.text, marginBottom:2 }}>{ins.title}</div>
              <div style={{ fontSize:"0.77rem", color:C.muted, lineHeight:1.55 }}>{ins.insight}</div>
            </div>
          </div>
        ))}
        <p style={{ fontSize:"0.64rem", color:C.muted, lineHeight:1.5, marginTop:6, paddingTop:8, borderTop:`1px solid ${C.border}` }}>
          ⚠ AI observations are not medical advice. Always consult your healthcare provider.
        </p>
      </NavyCard>

      {/* Recent entries */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"0.6rem" }}>
        <SectionLabel>Recent Entries</SectionLabel>
        <button onClick={()=>onNavigate("entries")} style={{ fontSize:"0.72rem", color:C.gold, background:"none", border:"none", cursor:"pointer", fontFamily:"inherit" }}>
          View all →
        </button>
      </div>
      {entries.slice(0,4).map(e => <EntryCard key={e.id} entry={e} onEdit={()=>{}} onDelete={()=>{}}/>)}

      {/* FAB */}
      <button onClick={onLog} style={{
        position:"fixed", bottom:24, right:24, width:56, height:56, borderRadius:28, border:"none",
        background:C.goldGrad, color:"#080e25", cursor:"pointer",
        display:"flex", alignItems:"center", justifyContent:"center",
        boxShadow:"0 4px 24px rgba(201,164,74,0.45)", zIndex:99, transition:"transform .15s",
      }}
        onMouseEnter={e => e.currentTarget.style.transform="scale(1.1)"}
        onMouseLeave={e => e.currentTarget.style.transform="scale(1)"}
      >
        <Plus size={26}/>
      </button>
    </div>
  );
}

// ─── ENTRIES LIST ─────────────────────────────────────────────────────────────
function EntriesList({ entries, onEdit, onDelete }) {
  const [q, setQ] = useState("");
  const [f, setF] = useState("all");

  const filtered = useMemo(() => entries.filter(e => {
    const qOk = !q || [...e.symptoms,...e.locations,...e.triggers,e.notes||""].join(" ").toLowerCase().includes(q.toLowerCase());
    const fOk = f==="all" || (f==="high"&&e.painLevel>=7) || (f==="med"&&e.painLevel>=4&&e.painLevel<7) || (f==="low"&&e.painLevel<4);
    return qOk && fOk;
  }), [entries, q, f]);

  return (
    <div className="fade-in">
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.8rem", color:C.text, marginBottom:"1rem" }}>Entry History</div>
      <div style={{ display:"flex", gap:8, marginBottom:"0.75rem" }}>
        <div style={{ flex:1, display:"flex", alignItems:"center", gap:8, background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"8px 12px" }}>
          <Search size={13} color={C.muted}/>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search entries…"
            style={{ border:"none", background:"none", fontFamily:"inherit", fontSize:"0.85rem", color:C.text, outline:"none", flex:1 }}
          />
        </div>
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:"1rem", flexWrap:"wrap" }}>
        {[["all","All"],["high","Severe (7+)"],["med","Moderate (4–6)"],["low","Mild (< 4)"]].map(([v,l]) => (
          <GoldChip key={v} label={l} selected={f===v} onClick={()=>setF(v)}
            color={v==="high"?"#e06070":v==="med"?"#d4805a":v==="low"?"#4ecf8a":undefined}/>
        ))}
      </div>
      <div style={{ fontSize:"0.72rem", color:C.muted, marginBottom:"0.5rem" }}>{filtered.length} entries</div>
      {filtered.length===0 && <div style={{ textAlign:"center", padding:"3rem", color:C.muted }}>No entries match your search.</div>}
      {filtered.map(e => <EntryCard key={e.id} entry={e} onEdit={onEdit} onDelete={onDelete}/>)}
    </div>
  );
}

// ─── ANALYTICS ────────────────────────────────────────────────────────────────
function Analytics({ entries }) {
  const [tab,   setTab]   = useState("trend");
  const [range, setRange] = useState(30);
  const re = useMemo(() => entries.filter(e => new Date(e.loggedAt) >= new Date(Date.now()-range*864e5)), [entries, range]);

  const trendData = useMemo(() => {
    const days = [];
    for (let i=range-1; i>=0; i--) {
      const day = new Date(Date.now()-i*864e5);
      const de  = entries.filter(e => new Date(e.loggedAt).toDateString()===day.toDateString());
      days.push({ day:fmt(day.toISOString(),"chart"), avg:de.length?+(de.reduce((s,e)=>s+e.painLevel,0)/de.length).toFixed(1):null });
    }
    return days;
  }, [entries, range]);

  const symData = useMemo(() => {
    const f={};
    re.forEach(e=>e.symptoms.forEach(s=>f[s]=(f[s]||0)+1));
    return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,c])=>({name:n,count:c}));
  }, [re]);

  const scatter = useMemo(() => re.filter(e=>e.sleepHours&&e.painLevel).map(e=>({sleep:e.sleepHours,pain:e.painLevel})), [re]);

  const trigData = useMemo(() => {
    const f={};
    re.forEach(e=>e.triggers.forEach(t=>f[t]=(f[t]||0)+1));
    return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(([n,c])=>({name:n,count:c}));
  }, [re]);

  // Location analytics — frequency by specific sub-location
  const locFreqData = useMemo(() => {
    const f={};
    re.forEach(e => e.locations.forEach(l => { f[l]=(f[l]||0)+1; }));
    return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,12)
      .map(([loc,count]) => ({ name:locShort(loc), region:locRegion(loc)||loc, count }));
  }, [re]);

  // Location analytics — frequency by region (grouped)
  const regionFreqData = useMemo(() => {
    const f={};
    re.forEach(e => e.locations.forEach(l => {
      const r = locRegion(l) || l;
      f[r]=(f[r]||0)+1;
    }));
    return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
  }, [re]);

  // Location analytics — average pain per sub-location (top 10)
  const locPainData = useMemo(() => {
    const agg={};
    re.forEach(e => e.locations.forEach(l => {
      if (!agg[l]) agg[l]={ sum:0, n:0, name:locShort(l), region:locRegion(l)||l };
      agg[l].sum += e.painLevel; agg[l].n++;
    }));
    return Object.values(agg)
      .filter(v=>v.n>=2)
      .map(v=>({ name:v.name, region:v.region, avg:+(v.sum/v.n).toFixed(1), count:v.n }))
      .sort((a,b)=>b.avg-a.avg).slice(0,10);
  }, [re]);

  const COLORS = [C.gold,"#d4805a","#4ecf8a","#9b7cd4","#e06070","#4eb5c0","#84cc4a","#e8b86a"];
  const TABS = [["trend","Trend"],["locations","Locations"],["symptoms","Symptoms"],["sleep","Sleep vs Pain"],["triggers","Triggers"]];

  return (
    <div className="fade-in">
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.8rem", color:C.text, marginBottom:"1rem" }}>Analytics</div>
      <div style={{ display:"flex", gap:6, marginBottom:"1.25rem", flexWrap:"wrap" }}>
        {[[7,"7 days"],[14,"14 days"],[30,"30 days"],[60,"60 days"]].map(([n,l]) => (
          <GoldChip key={n} label={l} selected={range===n} onClick={()=>setRange(n)}/>
        ))}
      </div>
      <div style={{ display:"flex", gap:0, background:C.card, borderRadius:12, padding:4, border:`1px solid ${C.border}`, marginBottom:"1.25rem", overflowX:"auto" }}>
        {TABS.map(([v,l]) => (
          <button key={v} onClick={()=>setTab(v)} style={{
            flex:1, padding:"8px 10px", borderRadius:9, border:"none", fontFamily:"inherit",
            fontWeight:500, fontSize:"0.75rem", cursor:"pointer", transition:"all .2s", whiteSpace:"nowrap",
            background: tab===v ? C.goldLight : "transparent",
            color: tab===v ? C.gold : "rgba(255,255,255,0.4)",
          }}>
            {l}
          </button>
        ))}
      </div>

      {tab==="trend" && (
        <NavyCard style={{ padding:"1rem 1rem 0.5rem" }} className="slide-up">
          <div style={{ fontSize:"0.72rem", color:C.muted, marginBottom:"1rem" }}>Daily average — {range} days ({re.length} entries)</div>
          <ResponsiveContainer width="100%" height={240}>
            <AreaChart data={trendData} margin={{top:4,right:4,left:-20,bottom:0}}>
              <defs>
                <linearGradient id="ag2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="5%"  stopColor={C.gold} stopOpacity={0.4}/>
                  <stop offset="95%" stopColor={C.gold} stopOpacity={0}/>
                </linearGradient>
              </defs>
              <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)" vertical={false}/>
              <XAxis dataKey="day" tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false} interval={Math.floor(range/7)}/>
              <YAxis domain={[0,10]} tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false}/>
              <ReferenceLine y={7} stroke="#e06070" strokeDasharray="4 4" strokeOpacity={0.5}/>
              <Tooltip content={<ChartTip/>}/>
              <Area type="monotone" dataKey="avg" name="Avg Pain" stroke={C.gold} strokeWidth={2.5}
                fill="url(#ag2)" connectNulls={false}
                dot={(props) => {
                  const { cx, cy, payload } = props;
                  if (!payload.avg) return null;
                  return <circle key={`d${cx}`} cx={cx} cy={cy} r={3.5} fill={getPainColor(payload.avg)} stroke={C.card} strokeWidth={1.5}/>;
                }}
              />
            </AreaChart>
          </ResponsiveContainer>
          <div style={{ display:"flex", alignItems:"center", gap:4, marginTop:4, fontSize:"0.67rem", color:"#e06070" }}>
            <div style={{ width:18, borderTop:"2px dashed #e06070" }}/> Severe threshold (7)
          </div>
        </NavyCard>
      )}

      {tab==="locations" && (
        <div className="slide-up">

          {/* ── Specific sub-location frequency ── */}
          <NavyCard style={{ padding:"1rem", marginBottom:"1rem" }}>
            <div style={{ fontSize:"0.72rem", color:C.muted, marginBottom:"1rem" }}>
              Most affected areas — last {range} days (by number of entries)
            </div>
            {locFreqData.length===0
              ? <div style={{ textAlign:"center", padding:"2rem", color:C.muted }}>No location data in this period.</div>
              : <ResponsiveContainer width="100%" height={Math.max(180, locFreqData.length*30)}>
                  <BarChart data={locFreqData} layout="vertical" margin={{top:4,right:50,left:8,bottom:4}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)" horizontal={false}/>
                    <XAxis type="number" tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false}/>
                    <YAxis type="category" dataKey="name" width={140}
                      tick={({x,y,payload}) => (
                        <text x={x} y={y} dy={4} textAnchor="end" fontSize={9} fill={C.text}>{payload.value}</text>
                      )}
                      tickLine={false} axisLine={false}/>
                    <Tooltip content={({active,payload}) => {
                      if (!active||!payload?.length) return null;
                      const d=payload[0].payload;
                      return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 12px",fontSize:"0.8rem"}}>
                        <div style={{color:C.gold,fontWeight:600}}>{d.name}</div>
                        <div style={{color:C.muted,fontSize:"0.72rem"}}>{d.region}</div>
                        <div style={{color:C.text,marginTop:2}}>{d.count} {d.count===1?"entry":"entries"}</div>
                      </div>;
                    }}/>
                    <Bar dataKey="count" name="Entries" radius={[0,6,6,0]}>
                      {locFreqData.map((_,i) => <Cell key={i} fill={COLORS[i%COLORS.length]}/>)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
            }
          </NavyCard>

          {/* ── Body region breakdown ── */}
          <NavyCard style={{ padding:"1rem", marginBottom:"1rem" }}>
            <div style={{ fontSize:"0.72rem", color:C.muted, marginBottom:"1rem" }}>
              Affected body regions — grouped
            </div>
            {regionFreqData.length===0
              ? <div style={{ textAlign:"center", padding:"2rem", color:C.muted }}>No data.</div>
              : <ResponsiveContainer width="100%" height={Math.max(140, regionFreqData.length*28)}>
                  <BarChart data={regionFreqData} layout="vertical" margin={{top:4,right:40,left:8,bottom:4}}>
                    <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)" horizontal={false}/>
                    <XAxis type="number" tick={{fontSize:9,fill:C.muted}} tickLine={false} axisLine={false}/>
                    <YAxis type="category" dataKey="name" width={120} tick={{fontSize:9,fill:C.text}} tickLine={false} axisLine={false}/>
                    <Tooltip content={<ChartTip/>}/>
                    <Bar dataKey="count" name="Entries" fill={C.gold} radius={[0,6,6,0]}/>
                  </BarChart>
                </ResponsiveContainer>
            }
          </NavyCard>

          {/* ── Average pain by location ── */}
          <NavyCard style={{ padding:"1rem" }}>
            <div style={{ fontSize:"0.72rem", color:C.muted, marginBottom:4 }}>
              Average pain level by location
            </div>
            <div style={{ fontSize:"0.72rem", color:C.gold, padding:"6px 10px", background:C.goldLight, borderRadius:8, marginBottom:"0.75rem" }}>
              Locations with fewer than 2 entries are excluded. Higher averages indicate more severe ongoing pain at that site.
            </div>
            {locPainData.length===0
              ? <div style={{ textAlign:"center", padding:"1.5rem", color:C.muted, fontSize:"0.82rem" }}>Not enough data yet — log more entries to see pain averages per location.</div>
              : <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {locPainData.map((d,i) => (
                    <div key={d.name} style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ width:16, fontSize:"0.65rem", color:C.muted, textAlign:"right", flexShrink:0 }}>#{i+1}</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
                          <span style={{ fontSize:"0.75rem", color:C.text, fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {d.name}
                            <span style={{ color:C.muted, fontSize:"0.65rem", marginLeft:5 }}>{d.region}</span>
                          </span>
                          <span style={{ fontSize:"0.7rem", color:getPainColor(d.avg), fontWeight:700, flexShrink:0, marginLeft:6 }}>
                            {d.avg}/10
                          </span>
                        </div>
                        <div style={{ height:6, background:C.bgDeep, borderRadius:3, overflow:"hidden" }}>
                          <div style={{ width:`${(d.avg/10)*100}%`, height:"100%", background:getPainColor(d.avg), borderRadius:3 }}/>
                        </div>

  const peak = filteredRe.length ? Math.max(...filteredRe.map(e=>e.painLevel)) : 0;

  const sf={};
  filteredRe.forEach(e=>e.symptoms.forEach(s=>sf[s]=(sf[s]||0)+1));

// ─── STORAGE KEY ─────────────────────────────────────────────────────────────
const STORAGE_KEY = "painlog-entries";

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [screen,       setScreen]       = useState("dashboard");
  const [entries,      setEntries]      = useState([]);
  const [editEntry,    setEditEntry]    = useState(null);
  const [aiInsights,   setAiInsights]   = useState([]);
  const [loadingAI,    setLoadingAI]    = useState(false);
  // Storage states
  const [storageReady, setStorageReady] = useState(false); // true once initial load done
  const [isSample,     setIsSample]     = useState(false); // true if we fell back to sample data
  const [saveStatus,   setSaveStatus]   = useState("idle"); // "idle" | "saving" | "saved" | "error"

  // ── Load from storage on mount ──────────────────────────────────────────────
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (Array.isArray(saved) && saved.length > 0) {
          setEntries(saved);
          setIsSample(false);
        } else {
          setEntries(INIT_DATA);
          setIsSample(true);
        }
      } else {
        // First visit — seed with sample data so the app isn't empty
        setEntries(INIT_DATA);
        setIsSample(true);
      }
    } catch {
      setEntries(INIT_DATA);
      setIsSample(true);
    }
    setStorageReady(true);
  }, []);

  // ── Auto-save whenever entries change (after initial load) ──────────────────
  useEffect(() => {
    if (!storageReady) return;
    let timer;
    setSaveStatus("saving");
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      setSaveStatus("saved");
      setIsSample(false);
      timer = setTimeout(() => setSaveStatus("idle"), 2000);
    } catch {
      setSaveStatus("error");
      timer = setTimeout(() => setSaveStatus("idle"), 3000);
    }
    return () => clearTimeout(timer);
  }, [entries, storageReady]);

  // ── Entry CRUD ───────────────────────────────────────────────────────────────
  const saveEntry = useCallback(entry => {
    setEntries(prev => {
      const exists = prev.find(e => e.id===entry.id);
      const next   = exists ? prev.map(e=>e.id===entry.id?entry:e) : [entry,...prev];
      return next.sort((a,b) => new Date(b.loggedAt)-new Date(a.loggedAt));
    });
    setEditEntry(null);
    setScreen("dashboard");
  }, []);

  const deleteEntry = useCallback(id => setEntries(prev => prev.filter(e=>e.id!==id)), []);

  const editEnt = useCallback(entry => {
    setEditEntry(entry);
    setScreen("log");
  }, []);

  const clearData = useCallback(() => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setEntries([]);
  }, []);

  // ── AI Insights ──────────────────────────────────────────────────────────────
  const fetchAI = useCallback(async () => {
    setLoadingAI(true);
    try {
      const last30 = entries.slice(0, 30);
      const avg    = (last30.reduce((s,e)=>s+e.painLevel,0)/last30.length).toFixed(1);
      const sf={}, tf={};
      last30.forEach(e => {
        e.symptoms.forEach(s => sf[s]=(sf[s]||0)+1);
        e.triggers.forEach(t => tf[t]=(tf[t]||0)+1);
      });
      const topSx = Object.entries(sf).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([s])=>s);
      const topTr = Object.entries(tf).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([t])=>t);
      const avgSleep = (last30.reduce((s,e)=>s+(e.sleepHours||7),0)/last30.length).toFixed(1);

      const prompt = `You are a compassionate health journal assistant. Provide 3 concise, helpful observations (NOT medical advice) based on this data.

Pain data (last ${last30.length} entries):
- Average pain: ${avg}/10
- High-pain entries (>=7): ${last30.filter(e=>e.painLevel>=7).length}
- Top symptoms: ${topSx.join(", ")||"varied"}
- Reported triggers: ${topTr.join(", ")||"none logged"}
- Average sleep: ${avgSleep} hrs/night

Format response as JSON array ONLY (no markdown):
[{"title":"Short title","insight":"1-2 sentence observation","type":"pattern|trend|tip"}]`;

      const res  = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:800, messages:[{role:"user",content:prompt}] })
      });
      const data = await res.json();
      const text = data.content[0].text.replace(/```json|```/g,"").trim();
      setAiInsights(JSON.parse(text));
    } catch {
      setAiInsights([{ title:"Could not load insights", insight:"Please try again.", type:"tip" }]);
    }
    setLoadingAI(false);
  }, [entries]);

  const goLog = useCallback(() => { setEditEntry(null); setScreen("log"); }, []);
  const navTo = useCallback(s => setScreen(s), []);

  // ── Loading splash while reading from storage ────────────────────────────────
  if (!storageReady) {
    return (
      <>
        <style>{STYLES}</style>
        <div style={{ minHeight:"100vh", background:C.bg, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:16 }}>
          <div style={{ width:48, height:48, borderRadius:14, background:C.goldGrad, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <Activity size={24} color="#080e25"/>
          </div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.6rem", fontStyle:"italic", background:C.goldGrad, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>
            PainLog
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8, color:C.muted, fontSize:"0.82rem" }}>
            <Loader size={14} className="spinning"/> Loading your data…
          </div>
        </div>
      </>
    );
  }

  // ── Save status badge (shown in header area) ─────────────────────────────────
  const SaveBadge = () => {
    if (saveStatus==="idle") return null;
    const cfg = {
      saving: { text:"Saving…",  color:C.muted,    icon:<Loader size={11} className="spinning"/> },
      saved:  { text:"Saved ✓",  color:"#4ecf8a",   icon:null },
      error:  { text:"Save failed", color:"#e06070", icon:null },
    }[saveStatus];
    return (
      <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:"0.72rem", color:cfg.color, transition:"opacity .3s" }}>
        {cfg.icon}{cfg.text}
      </div>
    );
  };

  return (
    <>
      <style>{STYLES}</style>
      <div style={{ minHeight:"100vh", background:C.bg, display:"flex", flexDirection:"column" }}>

        {/* Header with save status badge */}
        <div style={{ background:C.bgDeep, borderBottom:`1px solid ${C.border}`, padding:"0.9rem 1.5rem" }}>
          <div style={{ maxWidth:900, margin:"0 auto", display:"flex", alignItems:"center", gap:"1.5rem", flexWrap:"wrap" }}>
            <div style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:38, height:38, borderRadius:10, background:C.goldGrad, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Activity size={19} color="#080e25"/>
              </div>
              <div>
                <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:"1.5rem", fontWeight:600, fontStyle:"italic",
                  background:C.goldGrad, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", lineHeight:1 }}>
                  PainLog
                </div>
                <div style={{ fontSize:"0.58rem", color:C.muted, letterSpacing:"0.08em", textTransform:"uppercase", marginTop:1 }}>
                  Health Journal
                </div>
              </div>
            </div>
            <div style={{ borderLeft:`1px solid ${C.border}`, paddingLeft:"1.5rem", flex:1, minWidth:0 }}>
              <div style={{ fontSize:"0.78rem", color:C.muted, fontStyle:"italic" }}>"Every entry brings clarity."</div>
              <div style={{ fontSize:"0.68rem", color:C.gold, marginTop:2 }}>Tracking since May 2026</div>
            </div>
            {/* Save status + date */}
            <div style={{ display:"flex", alignItems:"center", gap:12 }}>
              <SaveBadge/>
              <div style={{ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, padding:"6px 14px", fontSize:"0.78rem", color:C.muted, whiteSpace:"nowrap" }}>
                📅 {fmt(new Date().toISOString(),"short")} {new Date().getFullYear()}
              </div>
            </div>
          </div>
        </div>

        {/* Sample data notice */}
        {isSample && (
          <div style={{ background:"rgba(201,164,74,0.1)", borderBottom:`1px solid ${C.borderGold}`, padding:"8px 1.5rem" }}>
            <div style={{ maxWidth:900, margin:"0 auto", fontSize:"0.75rem", color:C.gold, display:"flex", alignItems:"center", gap:6 }}>
              <span>ℹ</span>
              <span>Showing sample data. Any entries you log will be <strong>saved automatically</strong> and will reload next time you open PainLog.</span>
            </div>
          </div>
        )}

        <TabNav active={screen} setScreen={setScreen}/>
        <main style={{ flex:1, padding:"1.5rem", maxWidth:900, width:"100%", margin:"0 auto", paddingBottom:"3rem" }}>
          {screen==="dashboard" && <Dashboard entries={entries} onNavigate={navTo} onLog={goLog} aiInsights={aiInsights} loadingAI={loadingAI} fetchAI={fetchAI}/>}
          {screen==="log"       && <LogEntry onSave={saveEntry} onBack={()=>setScreen("dashboard")} editEntry={editEntry}/>}
          {screen==="entries"   && <EntriesList entries={entries} onEdit={editEnt} onDelete={deleteEntry}/>}
          {screen==="analytics" && <Analytics entries={entries}/>}
          {screen==="reports"   && <Reports entries={entries}/>}
          {screen==="settings"  && <SettingsScreen onClearData={clearData}/>}
        </main>
      </div>
    </>
  );
}

// ─── MOUNT ────────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
  </body>
</html>
